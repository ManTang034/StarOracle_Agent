chat_model:
  model_name: "qwen3-max"
  temperature: 0
  streaming: false
  verbose: true

emotion_model:
  model_name: "qwen3-max"
  temperature: 0
  streaming: false
  verbose: false

memory_extract_model:
  model_name: "qwen3-max"
  temperature: 0
  streaming: false
  verbose: false

embedding:
  model_name: "text-embedding-v4"

vector_store:
  collection_name: "user_memory"
  persist_directory: "memory/chroma"
  retrieval_limit: 4

knowledge_store:
  collection_name: "url_knowledge"
  persist_directory: "knowledge/chroma"
  chunk_size: 800
  chunk_overlap: 50
  retrieval_limit: 4

agent:
  enable_debug_middleware: true

yuanfenju:
  api_key: ""
  api_key_env: "YUANFENJU_API_KEY"
  endpoint: "https://api.yuanfenju.com/index.php/v1/Zhanbu/yunshi"
  lang: "zh-cn"
  parameter_style: "english"

