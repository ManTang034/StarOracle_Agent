chat_model:
  # 主聊天模型，负责最终回复生成。
  model_name: "qwen-max"
  temperature: 0
  streaming: false
  verbose: true

emotion_model:
  # 情绪识别模型，用于判断回复风格。
  model_name: "qwen3-max"
  temperature: 0
  streaming: false
  verbose: false

memory_extract_model:
  # 记忆抽取模型，只负责从对话中提炼可长期保存的信息。
  model_name: "qwen3-max"
  temperature: 0
  streaming: false
  verbose: false

embedding:
  # 向量化模型，用于知识库和长期记忆检索。
  model_name: "text-embedding-v4"

vector_store:
  # 长期记忆向量库配置，首次运行会自动在本地创建目录。
  collection_name: "user_memory"
  persist_directory: "memory/chroma"
  retrieval_limit: 4

memory_store:
  # 长期记忆分层配置：偏好、事实和最近上下文都会写入同一个向量库，但通过 metadata 区分。
  collection_name: "user_memory"
  persist_directory: "memory/chroma"
  retrieval_limit: 4
  preference_limit: 2
  fact_limit: 2
  recent_context_limit: 3
  preference_ttl_days: 365
  fact_ttl_days: 180
  recent_context_ttl_days: 7
  max_semantic_memories: 24
  max_recent_context_items: 6

knowledge_store:
  # 知识库向量库配置，URL / PDF / 文本都会切分后写入这里。
  collection_name: "url_knowledge"
  persist_directory: "knowledge/chroma"
  chunk_size: 600
  chunk_overlap: 80
  retrieval_limit: 4

agent:
  # 调试中间件是否启用，开源复现时建议先打开方便排错。
  enable_debug_middleware: false
  # 是否默认打开请求级 trace 调试日志；可由请求头临时覆盖。
  enable_trace_logging: false

tool_runtime:
  # 工具调用的统一超时配置，避免外部 API 挂住时拖慢整条 Agent 链路。
  search_timeout_seconds: 12
  daily_fortune_timeout_seconds: 20

yuanfenju:
  # 缘分局运势接口配置，API Key 优先走环境变量。
  api_key: ""
  api_key_env: "YUANFENJU_API_KEY"
  endpoint: "https://api.yuanfenju.com/index.php/v1/Zhanbu/yunshi"
  lang: "zh-cn"
  parameter_style: "english"

